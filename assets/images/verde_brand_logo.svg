<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 64" width="100%" height="100%">
  <!-- Definitions for styling and botanical branch -->
  <defs>
    <style>
      .brand-title {
        font-family: 'Playfair Display', serif;
        font-size: 30px;
        font-weight: 600;
        letter-spacing: 4px;
        fill: #1e201d;
      }
      .brand-sub {
        font-family: 'Plus Jakarta Sans', sans-serif;
        font-size: 9.5px;
        font-weight: 700;
        letter-spacing: 3.5px;
        fill: #4a5944;
      }
      .leaf-stem {
        stroke: #4a5944;
        stroke-width: 1.8;
        stroke-linecap: round;
        stroke-linejoin: round;
        fill: none;
      }
      .leaf-shape {
        fill: #6a7c63;
        opacity: 0.85;
      }
      .leaf-olive {
        fill: #a8623b;
      }
    </style>
  </defs>

  <!-- Botanical Emblem Icon (Intertwined V with organic olive branch) -->
  <g transform="translate(6, 4)">
    <!-- Stylized Serif V -->
    <path d="M 6 12 L 18 12 M 12 12 L 23 48 L 34 16 L 40 16" stroke="#1e201d" stroke-width="2.2" stroke-linecap="round" fill="none" />
    <path d="M 12 12 L 23 48" stroke="#1e201d" stroke-width="3.8" stroke-linecap="round" />
    
    <!-- Organic Leaf Spray -->
    <path d="M 23 48 C 22 36, 17 26, 8 18 C 3 13, 0 10, -2 6" class="leaf-stem" />
    
    <!-- Leaves -->
    <path d="M 8 18 C 5 14, 2 15, 0 18 C 2 21, 6 21, 8 18 Z" class="leaf-shape" />
    <path d="M 14 24 C 18 20, 22 22, 21 26 C 17 28, 14 27, 14 24 Z" class="leaf-shape" />
    <path d="M 18 33 C 14 31, 10 33, 9 37 C 13 39, 17 37, 18 33 Z" class="leaf-shape" />
    <path d="M 1 10 C -2 6, -5 8, -6 11 C -3 13, 0 13, 1 10 Z" class="leaf-shape" />
    
    <!-- Olive Berry Accent -->
    <circle cx="10" cy="27" r="2.2" class="leaf-olive" />
    <circle cx="2" cy="15" r="1.8" class="leaf-olive" />
  </g>

  <!-- Typography Wordmark -->
  <g transform="translate(58, 0)">
    <text x="0" y="36" class="brand-title">VERDE</text>
    <text x="135" y="32" class="brand-sub">STUDIO</text>
    <!-- Minimalist luxury dot accent -->
    <circle cx="123" cy="32" r="2.2" fill="#a8623b" />
  </g>
</svg>
